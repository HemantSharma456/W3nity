<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="secondaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="url(#primaryGradient)" />
  
  <!-- Lightning bolt (representing energy/speed) -->
  <path d="M85 50 L70 90 L85 90 L80 130 L120 90 L105 90 L115 50 Z" fill="white" opacity="0.9"/>
  
  <!-- W3 representation with connected nodes -->
  <circle cx="60" cy="140" r="8" fill="white" opacity="0.8"/>
  <circle cx="100" cy="140" r="8" fill="white" opacity="0.8"/>
  <circle cx="140" cy="140" r="8" fill="white" opacity="0.8"/>
  
  <!-- Connection lines -->
  <line x1="68" y1="140" x2="92" y2="140" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="108" y1="140" x2="132" y2="140" stroke="white" stroke-width="2" opacity="0.6"/>
  
  <!-- Unity representation - connecting arc -->
  <path d="M 60 132 Q 100 120 140 132" stroke="white" stroke-width="2" fill="none" opacity="0.6"/>
</svg>