<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" fill="none">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="currentColor" opacity="0.1" />
  
  <!-- Lightning bolt (representing energy/speed) -->
  <path d="M85 50 L70 90 L85 90 L80 130 L120 90 L105 90 L115 50 Z" fill="currentColor" opacity="0.8"/>
  
  <!-- W3 representation with connected nodes -->
  <circle cx="60" cy="140" r="8" fill="currentColor" opacity="0.6"/>
  <circle cx="100" cy="140" r="8" fill="currentColor" opacity="0.6"/>
  <circle cx="140" cy="140" r="8" fill="currentColor" opacity="0.6"/>
  
  <!-- Connection lines -->
  <line x1="68" y1="140" x2="92" y2="140" stroke="currentColor" stroke-width="2" opacity="0.4"/>
  <line x1="108" y1="140" x2="132" y2="140" stroke="currentColor" stroke-width="2" opacity="0.4"/>
  
  <!-- Unity representation - connecting arc -->
  <path d="M 60 132 Q 100 120 140 132" stroke="currentColor" stroke-width="2" fill="none" opacity="0.4"/>
</svg>